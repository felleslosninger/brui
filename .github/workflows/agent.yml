name: Agent

env:
  AGENT_NAME: claude
  AGENT_PACKAGE: "@anthropic-ai/claude-code@1.0.100"
  AGENT_COMMAND: claude
  AGENT_ARGS: --permission-mode acceptEdits --output-format text
  AGENT_SUGGEST_LABEL: agent:suggest

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - id: context
        uses: actions/github-script@v8
        env:
          AGENT_NAME: ${{ env.AGENT_NAME }}
          AGENT_SUGGEST_LABEL: ${{ env.AGENT_SUGGEST_LABEL }}
        with:
          script: |
            const agent = process.env.AGENT_NAME;
            const suggestLabel = process.env.AGENT_SUGGEST_LABEL;
            const payload = context.payload;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;

            async function actorHasWriteAccess() {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: context.actor,
                });
                return ["admin", "maintain", "write"].includes(data.permission);
              } catch {
                return false;
              }
            }

            let match = false;
            let canSuggest = false;
            let number = "";
            let author = "";
            let ref = context.sha;
            let prompt = "";

            if (context.eventName === "issues") {
              const issue = payload.issue;
              const issueLabels = issue.labels || [];
              const addedLabel = payload.label?.name;
              if (addedLabel === agent || addedLabel === suggestLabel) {
                number = String(issue.number);
                author = issue.user.login;
                match = issueLabels.some((label) => label.name === agent) && (await actorHasWriteAccess());
                canSuggest = issueLabels.some((label) => label.name === suggestLabel);
                prompt = [issue.title, issue.body || ""].filter(Boolean).join("\n\n");
              }
            } else if (context.eventName === "pull_request_target") {
              const pr = payload.pull_request;
              const prLabels = pr.labels || [];
              const addedLabel = payload.label?.name;
              if (addedLabel === agent || addedLabel === suggestLabel) {
                number = String(pr.number);
                author = pr.user.login;
                const isSameRepo = pr.head.repo.full_name === repoFullName;
                match = prLabels.some((label) => label.name === agent) && isSameRepo && (await actorHasWriteAccess());
                canSuggest = prLabels.some((label) => label.name === suggestLabel);
                if (match) {
                  ref = pr.head.sha;
                  prompt = [pr.title, pr.body || ""].filter(Boolean).join("\n\n");
                }
              }
            } else if (context.eventName === "issue_comment") {
              const comment = payload.comment?.body || "";
              const chatsWithAgent =
                comment.startsWith(`/${agent}`) ||
                comment.startsWith(`@${agent}`) ||
                comment.includes(` @${agent}`);
              const isBotComment = Boolean(payload.comment?.user?.type === "Bot" || payload.comment?.user?.login === "github-actions[bot]");
              const isActorTrusted = await actorHasWriteAccess();

              if (chatsWithAgent && isActorTrusted && !isBotComment) {
                match = true;
                number = String(payload.issue.number);
                author = payload.issue.user.login;
                prompt = [payload.issue.title, payload.issue.body || "", comment].filter(Boolean).join("\n\n");

                if (payload.issue.pull_request) {
                  const pr = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: payload.issue.number,
                  });

                  if (pr.data.head.repo.full_name !== repoFullName) {
                    core.setOutput("match", "false");
                    return;
                  }

                  ref = pr.data.head.sha;
                  canSuggest = (pr.data.labels || []).some((label) => label.name === suggestLabel);
                } else {
                  canSuggest = payload.issue.labels?.some((label) => label.name === suggestLabel) ?? false;
                }
              }
            }

            core.setOutput("match", String(match));
            core.setOutput("can_suggest", String(canSuggest));
            core.setOutput("number", number);
            core.setOutput("author", author);
            core.setOutput("ref", ref);
            core.setOutput("prompt", prompt);

      - if: steps.context.outputs.match == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.ref }}
          persist-credentials: false

      - if: steps.context.outputs.match == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - if: steps.context.outputs.match == 'true'
        run: npm install --global "${AGENT_PACKAGE}"

      - if: steps.context.outputs.match == 'true'
        env:
          PROMPT: ${{ steps.context.outputs.prompt }}
          AGENT_AUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_PATH: ${{ runner.temp }}/agent-prompt.txt
          RESPONSE_PATH: ${{ runner.temp }}/agent-response.txt
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AGENT_AUTH_TOKEN}" ]]; then
            echo "Missing CLAUDE_CODE_OAUTH_TOKEN."
            exit 1
          fi

          printf '%s' "${PROMPT}" > "${PROMPT_PATH}"
          export CLAUDE_CODE_OAUTH_TOKEN="${AGENT_AUTH_TOKEN}"
          "${AGENT_COMMAND}" -p "$(cat "${PROMPT_PATH}")" ${AGENT_ARGS} | tee "${RESPONSE_PATH}"

      - id: branch
        if: steps.context.outputs.match == 'true' && steps.context.outputs.can_suggest == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          branch="agent/${AGENT_NAME}-${{ steps.context.outputs.number }}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add -A
          git commit -m "agent: address #${{ steps.context.outputs.number }}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 | tr -d '\n')" push origin "HEAD:${branch}"

          echo "created=true" >> "${GITHUB_OUTPUT}"
          echo "name=${branch}" >> "${GITHUB_OUTPUT}"

      - if: always() && steps.context.outputs.match == 'true'
        uses: actions/github-script@v8
        env:
          NUMBER: ${{ steps.context.outputs.number }}
          AUTHOR: ${{ steps.context.outputs.author }}
          BRANCH_CREATED: ${{ steps.branch.outputs.created }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          AGENT_NAME: ${{ env.AGENT_NAME }}
          RESPONSE_PATH: ${{ runner.temp }}/agent-response.txt
        with:
          script: |
            const fs = require("fs");

            const number = Number(process.env.NUMBER);
            const author = process.env.AUTHOR;
            const branchCreated = process.env.BRANCH_CREATED === "true";
            const branchName = process.env.BRANCH_NAME;
            const agent = process.env.AGENT_NAME;

            let prUrl = "";
            if (branchCreated) {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${agent}: address #${number}`,
                head: branchName,
                base: context.payload.repository.default_branch,
                body: `Closes #${number}\n\n@${author}`,
              });
              prUrl = pr.data.html_url;
            }

            const response = fs.existsSync(process.env.RESPONSE_PATH)
              ? fs.readFileSync(process.env.RESPONSE_PATH, "utf8")
              : "Agent run failed.";

            let body = prUrl ? `PR: ${prUrl}\n\n${response}` : response;
            const maxLength = 60000;
            if (body.length > maxLength) {
              const logsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              body = body.slice(0, maxLength) + `\n\n---\n*Truncated. [Full output](${logsUrl})*`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body,
            });
