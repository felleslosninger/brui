inference:
  local-nano:
    endpoint: "http://localhost:11434/v1/chat/completions"
    model: "gemma4:26b"
  
  external-nano:
    endpoint: "https://ollama.sandkasse.ai/v1/chat/completions"
    model: "gemma4:26b"

  envoy-default:
    endpoint: "https://gw.sandkasse.ai/v1/chat/completions"
    model: "telenor-default"
    headers:
      Authorization: "Bearer ${ENVOY_API_KEY}"
      x-ai-eg-model: "${MODEL}"
