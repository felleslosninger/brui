<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lab site0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div class="container">
        <div class="tool-output">
          <div class="output-header">
            <h3>Tool Activity</h3>
            <button id="toggleTools" class="toggle-tools">Available Tools</button>
          </div>
          <div id="availableTools" class="available-tools hidden">
            <div class="tools-list"></div>
          </div>
          <div id="eventLog" class="event-log">
            <div class="empty-state">No tools used yet</div>
          </div>
        </div>
        
        <div class="input-section">
          <div class="input-group">
            <input id="input" type="text" />
            <button id="submit">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <style>
      * {
        box-sizing: border-box;
      }
      
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: white;
        color: #2d3748;
      }
      
      #app {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      
      .container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      
      .tool-output {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        min-height: 280px;
      }
      
      .output-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        background: rgba(248, 250, 252, 0.8);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .output-header h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #1a202c;
      }
      
      .toggle-tools {
        background: none;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        color: #6b7280;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: none;
        transform: none;
        min-width: auto;
      }
      
      .toggle-tools:hover {
        background: #f9fafb;
        border-color: #d1d5db;
        transform: none;
        box-shadow: none;
      }
      
      .available-tools {
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        background: rgba(249, 250, 251, 0.8);
        padding: 16px 24px;
      }
      
      .available-tools.hidden {
        display: none;
      }
      
      .tool-item {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 8px;
      }
      
      .tool-item:last-child {
        margin-bottom: 0;
      }
      
      .tool-item-name {
        font-weight: 600;
        color: #374151;
        font-size: 14px;
        margin-bottom: 4px;
      }
      
      .tool-item-description {
        color: #6b7280;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      
      .tool-properties {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #f3f4f6;
      }
      
      .properties-header {
        font-size: 12px;
        font-weight: 600;
        color: #4b5563;
        margin-bottom: 8px;
      }
      
      .property-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 8px;
        padding: 8px;
        background: #fafbfc;
        border-radius: 6px;
      }
      
      .property-item:last-child {
        margin-bottom: 0;
      }
      
      .property-name {
        font-weight: 500;
        font-size: 13px;
      }
      
      .property-name.required {
        color: #dc2626;
      }
      
      .property-name.required::after {
        content: " *";
        color: #dc2626;
      }
      
      .property-name.optional {
        color: #6b7280;
      }
      
      .property-type {
        font-size: 11px;
        color: #9ca3af;
        font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        background: #f1f5f9;
        padding: 2px 6px;
        border-radius: 4px;
        width: fit-content;
      }
      
      .property-description {
        font-size: 12px;
        color: #6b7280;
        font-style: italic;
        line-height: 1.4;
      }
      
      .event-log {
        padding: 24px;
        min-height: 200px;
        font-size: 14px;
        line-height: 1.6;
        overflow-y: auto;
        max-height: 400px;
      }
      
      .empty-state {
        color: #a0aec0;
        text-align: center;
        padding: 40px 20px;
        font-style: italic;
      }
      
      .reasoning-state {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: #6b7280;
        text-align: center;
        min-height: 120px;
      }
      
      .reasoning-text {
        font-size: 15px;
        font-weight: 500;
      }
      
      .tool-call {
        background: rgba(59, 130, 246, 0.05);
        border: 1px solid rgba(59, 130, 246, 0.1);
        border-radius: 12px;
        padding: 16px;
        transition: all 0.2s ease;
      }
      
      .tool-call:hover {
        background: rgba(59, 130, 246, 0.08);
        border-color: rgba(59, 130, 246, 0.2);
      }
      
      .tool-type {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 8px;
        font-weight: 500;
      }
      
      .tool-name {
        font-weight: 600;
        color: #3b82f6;
        margin-bottom: 8px;
        font-size: 15px;
      }
      
      .tool-args {
        background: rgba(15, 23, 42, 0.03);
        border-radius: 8px;
        padding: 12px;
        font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        font-size: 13px;
        color: #475569;
        word-break: break-all;
      }
      
      .input-section {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 24px;
      }
      
      .input-group {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      
      input[type="text"] {
        flex: 1;
        padding: 16px 20px;
        font-size: 16px;
        border: 2px solid rgba(203, 213, 225, 0.5);
        border-radius: 12px;
        outline: none;
        background: rgba(248, 250, 252, 0.8);
        transition: all 0.2s ease;
        font-family: inherit;
      }
      
      input[type="text"]:focus {
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }
      
      input[type="text"]::placeholder {
        color: #94a3b8;
      }
      
      button {
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: #6b7280;
        color: white;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        box-shadow: 0 4px 12px rgba(107, 114, 128, 0.2);
      }
      
      button:hover {
        background: #4b5563;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(107, 114, 128, 0.3);
      }
      
      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(107, 114, 128, 0.2);
      }
      
      @media (max-width: 640px) {
        .container {
          max-width: 100%;
        }
        
        .input-section, .tool-output {
          margin: 0 8px;
        }
        
        input[type="text"] {
          font-size: 16px;
        }
      }
    </style>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
